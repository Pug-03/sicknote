<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="SickNote cover">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14181d"/>
      <stop offset="1" stop-color="#0b0d0f"/>
    </linearGradient>
    <linearGradient id="cgrn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ee06a"/>
      <stop offset="1" stop-color="#25b84b"/>
    </linearGradient>
    <radialGradient id="cglowG">
      <stop offset="0" stop-color="#30d158" stop-opacity=".20"/>
      <stop offset="1" stop-color="#30d158" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cglowB">
      <stop offset="0" stop-color="#0a84ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="840" height="300" fill="#0b0d0f"/>
  <rect width="840" height="300" fill="url(#cbg)"/>
  <circle cx="90" cy="30" r="260" fill="url(#cglowG)"/>
  <circle cx="770" cy="280" r="250" fill="url(#cglowB)"/>

  <!-- เครื่องหมายย่อทางซ้าย -->
  <g transform="translate(56 78) scale(0.286)">
    <path d="M132 118a26 26 0 0 1 26-26h140l82 82v220a26 26 0 0 1-26 26H158a26 26 0 0 1-26-26z" fill="#e8edf2"/>
    <path d="M298 92l82 82h-60a22 22 0 0 1-22-22z" fill="#9aa3ad"/>
    <circle cx="352" cy="358" r="82" fill="#0b0d0f"/>
    <circle cx="352" cy="358" r="70" fill="url(#cgrn)"/>
    <path d="M320 358l22 23 45-47" fill="none" stroke="#08210f" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">

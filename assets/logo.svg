<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SickNote logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181c21"/>
      <stop offset="1" stop-color="#0b0d0f"/>
    </linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ee06a"/>
      <stop offset="1" stop-color="#25b84b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dde4"/>
    </linearGradient>
    <radialGradient id="glowG">
      <stop offset="0" stop-color="#30d158" stop-opacity=".22"/>
      <stop offset="1" stop-color="#30d158" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#0a84ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle"><rect width="512" height="512" rx="114"/></clipPath>
  </defs>

  <!-- พื้นหลังโค้งมนสไตล์ไอคอน iOS -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  <!-- แสงเขียวเรืองมุมบน -->
  <g clip-path="url(#squircle)">
    <circle cx="150" cy="120" r="230" fill="url(#glowG)"/>
    <circle cx="392" cy="420" r="210" fill="url(#glowB)"/>
  </g>

  <!-- ใบลา: กระดาษมุมพับ -->
  <path d="M132 118a26 26 0 0 1 26-26h140l82 82v220a26 26 0 0 1-26 26H158a26 26 0 0 1-26-26z" fill="url(#paper)"/>
  <path d="M298 92l82 82h-60a22 22 0 0 1-22-22z" fill="#9aa3ad"/>
  <!-- บรรทัดข้อความบนใบลา -->
  <g fill="#8b96a2" opacity=".85">
    <rect x="172" y="212" width="150" height="15" rx="7.5"/>
    <rect x="172" y="256" width="186" height="15" rx="7.5"/>
    <rect x="172" y="300" width="112" height="15" rx="7.5"/>
  </g>

  <!-- ตราประทับอนุมัติ: เครื่องหมายถูกสีเขียว -->
  <circle cx="352" cy="358" r="82" fill="#0b0d0f"/>
  <circle cx="352" cy="358" r="70" fill="url(#grn)"/>
  <path d="M320 358l22 23 45-47" fill="none" stroke="#08210f" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
